<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Antenna -->
  <line x1="32" y1="10" x2="32" y2="18"
        stroke="#94a3b8"
        stroke-width="3"
        stroke-linecap="round"/>
  <circle cx="32" cy="7" r="4" fill="#22d3ee"/>

  <!-- Robot Head -->
  <rect x="14" y="18" width="36" height="30" rx="8"
        fill="url(#face)"/>

  <!-- Eyes -->
  <circle cx="25" cy="31" r="4" fill="#0f172a"/>
  <circle cx="39" cy="31" r="4" fill="#0f172a"/>

  <!-- Eye Glow -->
  <circle cx="25" cy="30" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="39" cy="30" r="1.2" fill="#ffffff" opacity="0.9"/>

  <!-- Mouth -->
  <rect x="24" y="39" width="16" height="4" rx="2"
        fill="#0f172a"/>

  <!-- Side Ears -->
  <rect x="9" y="27" width="5" height="10" rx="2"
        fill="#94a3b8"/>
  <rect x="50" y="27" width="5" height="10" rx="2"
        fill="#94a3b8"/>
</svg>